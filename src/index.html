<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>phunbot</title><style>body{margin:0;background:#10141c;color:#e2e8f0;font:15px system-ui;display:flex;height:100vh}aside{width:260px;background:#171e29;padding:20px;overflow:auto;border-right:1px solid #303a49}main{flex:1;display:flex;flex-direction:column;min-width:0}header{padding:18px;border-bottom:1px solid #303a49;display:flex;gap:12px;align-items:center}h1{font-size:22px;letter-spacing:.02em;margin:0 0 20px}button,input,select,textarea{color:inherit;background:#242e3e;border:1px solid #445167;border-radius:8px;padding:10px;font:inherit}button{cursor:pointer}button:hover{background:#35435a}aside button{width:100%;text-align:left;margin:5px 0}#messages{flex:1;overflow:auto;padding:24px;white-space:pre-wrap;overflow-wrap:anywhere}.message{max-width:900px;padding:14px;margin:12px auto;background:#192230;border-radius:10px}.user{border-left:3px solid #63b3ed}.tool{font:12px monospace;color:#a9b7cb}.role{font-size:12px;color:#96a8c0;margin-bottom:8px}form{padding:18px;border-top:1px solid #303a49;display:flex;gap:10px;flex-wrap:wrap}textarea{flex:1;min-width:180px;resize:vertical}#status{color:#9bd6a9;font-size:13px}.folder{margin-top:18px;color:#9cacbe;font-size:12px;text-transform:uppercase}#login{position:fixed;inset:0;background:#10141c;display:flex;align-items:center;justify-content:center;z-index:2}#login>div{max-width:420px;padding:30px}.hidden{display:none!important}@media(max-width:700px){aside{width:140px;padding:12px}header{flex-wrap:wrap}button{padding:8px}}</style></head><body><aside><h1>phunbot</h1><button id="new">New conversation</button><div id="history"></div></aside><main><header><select id="model"><option>fleet-fast</option><option>fleet-deep</option><option>fleet-vision</option><option>fleet-code</option><option>fleet-fast-spark</option></select><button id="folder">Move to folder</button><button id="approvals">Approvals</button><button id="cancel">Cancel</button><span id="status">Ready</span></header><div id="messages"></div><form id="composer"><textarea id="prompt" rows="3" placeholder="Ask a question, or use /goal for persistent work" required></textarea><input id="image" type="file" accept="image/png,image/jpeg,image/webp"><button type="submit">Send</button></form></main><div id="login"><div><h1>phunbot</h1><p>Enter your local access token. Your Pi model credentials stay on the server.</p><input id="token" type="password" autocomplete="current-password" placeholder="Access token"><button id="connect">Open phunbot</button><p id="loginerror"></p></div></div><script src="/ui.js" defer></script><dialog id="approvaldialog" style="background:#171e29;color:#e2e8f0;max-width:720px;border:1px solid #445167;border-radius:10px"><h2>Approve an exact operation</h2><pre id="approvaldetail" style="white-space:pre-wrap"></pre><button id="approveonce">Approve once</button> <button id="denyaction">Deny</button> <button id="closeapproval">Not now</button></dialog></body></html>
