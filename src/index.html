<!doctype html>
<html lang="en">
<head>

<svg aria-hidden="true" class="symbol-definitions"><defs>
<symbol id="chat" viewBox="0 0 24 24"><path d="M21 11.5a8.5 8.5 0 0 1-8.5 8.5 9.2 9.2 0 0 1-4.6-1.2L3 20l1.4-4.6A8.5 8.5 0 1 1 21 11.5z"/></symbol><symbol id="target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></symbol><symbol id="plus" viewBox="0 0 24 24"><path d="M12 4v16M4 12h16"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="7"/><path d="m16 16 5 5"/></symbol><symbol id="folder" viewBox="0 0 24 24"><path d="M3 6a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v11H3z"/></symbol><symbol id="chevron" viewBox="0 0 24 24"><path d="m9 6 6 6-6 6"/></symbol><symbol id="check" viewBox="0 0 24 24"><path d="m4 12 5 5L20 6"/></symbol><symbol id="menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M12 20V4m-6 6 6-6 6 6"/></symbol><symbol id="clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol><symbol id="brain" viewBox="0 0 24 24"><path d="M12 7c-2-4-8-2-8 2a4 4 0 0 0 0 6c-1 4 4 6 7 3V6m1 1c2-4 8-2 8 2a4 4 0 0 1 0 6c1 4-4 6-7 3V6"/></symbol><symbol id="wrench" viewBox="0 0 24 24"><path d="M14 4a6 6 0 0 0-6 8l-5 5a2 2 0 0 0 3 3l5-5a6 6 0 0 0 8-6l-4 3-3-3 2-5z"/></symbol><symbol id="book" viewBox="0 0 24 24"><path d="M12 6C9 4 5 4 3 5v13c3-1 7-1 9 1 2-2 6-2 9-1V5c-2-1-6-1-9 1zm0 0v13"/></symbol><symbol id="x" viewBox="0 0 24 24"><path d="m5 5 14 14M19 5 5 19"/></symbol></defs></svg>
<div class="app"><aside class="sidebar" id="sidebar" aria-label="Sidebar"><div class="brand"><span class="logotype"><span class="logomark">◈</span> PhunBot</span><button class="icon-button" id="search-button" aria-label="Search"><svg class="icon"><use href="#search"/></svg></button></div><nav class="navigation"><button class="navlink" id="new-chat"><svg class="icon"><use href="#plus"/></svg>New conversation</button><button class="navlink" id="goalsnav"><svg class="icon"><use href="#target"/></svg>Goals<span class="nav-count" id="navcount"></span></button></nav><div class="side-scroll"><div class="navheading folder-heading">Folders<button id="new-folder" class="icon-button" aria-label="Create folder"><svg class="icon"><use href="#plus"/></svg></button></div><div id="folders"></div><div class="navheading">Recent conversations</div><div id="recents"></div></div><div class="side-foot">PhunBot · Connected</div></aside><div class="scrim" id="scrim"></div><main><header class="topbar"><button class="icon-button mobile-menu" id="menu-button" aria-label="Open menu"><svg class="icon"><use href="#menu"/></svg></button><div class="title-group"><h1 id="viewtitle"></h1></div><div class="top-status" id="headstatus"></div><button class="icon-button" id="organize" aria-label="Rename or move conversation" title="Rename or move"><svg class="icon"><use href="#wrench"/></svg></button></header><section class="view" id="chatview"><div class="scroll" id="chatscroll"><div class="messages" id="messages"></div></div><div id="execution-area"><details id="trace-panel" hidden><summary><span id="trace-count">Execution details</span></summary><div id="traces"></div></details></div><div class="compose-wrap"><form class="composer" id="composer"><textarea rows="2" id="composeinput" aria-label="Message PhunBot" placeholder="Message PhunBot..."></textarea><div class="controls"><button type="button" class="icon-button subtle-plus" id="attach-button" aria-label="Attach"><svg class="icon"><use href="#plus"/></svg></button><input id="attachment-input" type="file" accept="image/png,image/jpeg,image/gif,image/webp" multiple hidden><label class="model-control"><select id="model" aria-label="Model"><option value="">Default model</option></select></label><button class="send" type="submit" aria-label="Send message"><svg class="icon"><use href="#arrow"/></svg></button></div></form><div id="attachments" class="attachment-list"></div><p id="notice" role="alert"></p></div></section><section class="view" id="goalsview" hidden><div class="scroll"><div class="page goalspage"><div class="filters" id="filters"></div><div id="goallist"></div></div></div></section><section class="view" id="detailview" hidden><div class="goalhead"><button class="back" id="back-goals"><svg class="icon"><use href="#chevron"/></svg> All goals</button><h2 id="goalheading"></h2><div id="goalmeta" class="goalmeta"></div></div><div id="goalcontent" class="goalcontent"></div></section></main></div><div class="searchmodal" id="searchmodal" hidden><div class="searchbox"><div class="searchbar"><strong>Search</strong><button aria-label="Close search" class="icon-button" id="close-search"><svg class="icon"><use href="#x"/></svg></button></div><input id="searchinput" placeholder="Search conversations and goals"><div id="searchresults"></div><label class="validation-toggle"><input type="checkbox" id="show-validation"> Show validation conversations</label></div></div><div id="login" role="dialog" aria-modal="true"><form id="login-form"><span class="logomark">◈</span><h1>Connect to PhunBot</h1><p>Use your conversation access token. Privileged operations require separate owner authorization.</p><label for="token">Access token</label><input id="token" type="password" autocomplete="off" required><button type="submit" class="primary-button">Connect</button><p id="loginerror" role="alert"></p></form></div>
<script type="module" src="/ui.js"></script>
