const opened=new Set();const folded=new Set();

 {id:'minecraft',name:'Server troubleshooting',folder:'Unraid',unread:true,history:[

 ]},

 {id:'mcp',name:'Define MCP',folder:'',unread:false,history:[{kind:'user',text:'Define MCP.'},{kind:'assistant',text:'MCP, or Model Context Protocol, standardizes how AI applications access external tools and resources.'}]},
 {id:'it',name:'IT Powerscaling Explained',folder:'',unread:false,history:[{kind:'user',text:'What is the highest level of powerscaling?'},{kind:'assistant',text:'There is no universally agreed maximum; power-scaling tiers depend on the fictional framework.'}]}

 {id:'minecraft',chat:'minecraft',title:'Restore external Minecraft connectivity so a player outside the network can join.',status:'blocked',block:'approval',stage:0,children:[

function statusLabel(g){return ({working:'Working',blocked:'Needs you',waiting:'Waiting',completed:'Completed',queued:'Queued',paused:'Paused',cancelled:'Cancelled'})[g.status]||g.status;}
function animationPhase(duration,stagger=0){return `style="animation-delay:-${((performance.now()-stagger)%duration+duration)%duration}ms"`;}
function sig(kind){if(kind==='working')return `<i class="signal working" title="Goal working" ${animationPhase(1250)}></i>`;if(kind==='blocked')return '<i class="signal blocked" title="Needs your response">!</i>';if(kind==='waiting')return `<span class="signal waiting" title="Waiting for external service">${ico('clock')}</span>`;return '<i class="signal unread" title="Unread response"></i>';}
function childIcon(status){return `<span class="goal-icon ${esc(status)}" ${status==='working'?animationPhase(1500):''}>${status==='completed'?ico('check'):status==='waiting'?ico('clock'):''}</span>`;}
function view(name){page=name;['chat','goals','detail'].forEach(x=>$(x+'view').hidden=x!==name);$('goalsnav').classList.toggle('active',name==='goals'||name==='detail');}
function renderSidebar(){
 const gs=goals.filter(g=>g.status==='working').length;const need=goals.filter(g=>g.status==='blocked').length;
 $('navcount').innerHTML=`${gs?sig('working')+'<span>'+gs+'</span>':''}${need?sig('blocked')+'<span>'+need+'</span>':''}`;
 const item=c=>`<button class="chatlink ${c.id===chatId&&page==='chat'?'selected':''} ${c.unread?'unread':''}" onclick="showChat('${c.id}')">${ico('chat','bubble-icon')}<span class="name">${esc(c.name)}</span><span class="signals">${c.unread?sig('unread'):''}${goals.filter(g=>g.chat===c.id&&g.status==='working').length?sig('working'):''}${goals.filter(g=>g.chat===c.id&&g.status==='blocked').length?sig('blocked'):''}</span></button>`;
 const folders=[...new Set(chats.map(c=>c.folder).filter(Boolean))];
 $('folders').innerHTML=folders.map(name=>`<button class="folder ${folded.has(name)?'closed':''}" onclick="toggleFolder('${esc(name)}')">${ico('folder')}${esc(name)}${ico('chevron','folder-arrow')}</button>${folded.has(name)?'':`<div class="folder-group">${chats.filter(c=>c.folder===name).map(item).join('')}</div>`}`).join('');
 $('recents').innerHTML=chats.filter(c=>!c.folder).map(item).join('');
}
function toggleFolder(name){folded.has(name)?folded.delete(name):folded.add(name);renderSidebar();}
function renderMessage(m){if(m.kind==='user')return `<div class="message user">${esc(m.text)}</div>`;
 const content=esc(m.text).replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
 return `<div class="message assistant"><p>${content}</p></div>`;
}
function showChat(id){const c=getChat(id);if(!c)return;chatId=id;c.unread=false;view('chat');$('viewtitle').textContent=c.name;const active=activeGoals(id);$('headstatus').innerHTML=active.length?`${sig('working')} Working`:'';
 $('messages').innerHTML=c.history.map(renderMessage).join('')+(active.length?`<div class="typing" aria-label="PhunBot is working"><i ${animationPhase(1100)}></i><i ${animationPhase(1100,150)}></i><i ${animationPhase(1100,300)}></i></div>`:'');renderSidebar();closeSidebar();requestAnimationFrame(()=>$('chatscroll').scrollTop=$('chatscroll').scrollHeight);}
function showGoals(newfilter){filter=newfilter||filter||'all';view('goals');$('viewtitle').textContent='Goals';$('headstatus').innerHTML='';const options=[['all','All'],['working','Working'],['blocked','Needs you'],['waiting','Waiting'],['completed','Completed'],['paused','Paused']];$('filters').innerHTML=options.map(([k,v])=>`<button class="filter ${filter===k?'current':''}" onclick="showGoals('${k}')">${v}</button>`).join('');
 let list=goals.filter(g=>filter==='all'||g.status===filter);$('goallist').innerHTML=list.map(g=>`<button class="goalrow" onclick="showGoal('${g.id}')">${childIcon(g.status)}<span style="flex:1;min-width:0"><span class="primary-text">${esc(g.title)}</span><span class="minor" style="display:block">${esc(getChat(g.chat)?.name||'Autonomous')} · ${esc(statusLabel(g))}</span></span>${ico('chevron','right')}</button>`).join('')||'<p class="empty">No goals in this view.</p>';renderSidebar();closeSidebar();}
function showGoal(id){const g=getGoal(id);if(!g)return;goalId=id;view('detail');$('viewtitle').textContent='Goals';$('headstatus').innerHTML='';$('goalheading').textContent=g.title;
 $('goalmeta').innerHTML=`<span class="status ${g.status}">${esc(statusLabel(g))}</span><span>·</span><button onclick="showChat('${g.chat}')">${esc(getChat(g.chat)?.name||'Autonomous')}</button>`;
 let strip='';if(g.status==='blocked')strip=`<div class="wait-strip">${ico('chat')}<span>${g.block==='approval'?'Waiting for your approval':'Waiting for your answer'} in <button onclick="showChat('${g.chat}')">${esc(getChat(g.chat).name)}</button></span></div>`;
 if(g.status==='waiting')strip=`<div class="wait-strip">${ico('clock')}<span>Nextcloud returned HTTP 503. Retrying automatically; no action needed.</span></div>`;
 const children=g.children.map((ch,i)=>{const key=`${g.id}-${i}`,isOpen=opened.has(key);return `<div class="child"><div class="childtop">${childIcon(ch.status)}<div style="flex:1;min-width:0"><div class="childtitle">${esc(ch.title)}</div><div class="childstatus">${esc(statusLabel(ch))}</div></div></div>${ch.events.length?`<button class="details-toggle" aria-expanded="${isOpen}" onclick="toggleEvents('${key}')">${ico('chevron')} ${isOpen?'Hide':'Show'} execution (${ch.events.length})</button>${isOpen?`<div class="events">${ch.events.map(e=>renderEvent(e)).join('')}</div>`:''}`:''}</div>`}).join('');
 const now=g.children.find(c=>c.status==='working');const nowHTML=now?`<section class="gsection"><h3>Working on</h3><div class="childtitle">${esc(now.title)}</div></section>`:'';
 $('goalcontent').innerHTML=`${strip}${nowHTML}<section class="gsection"><h3>Child goals</h3>${children}</section>${demoHTML(g)}`;renderSidebar();closeSidebar();}
function renderEvent(e){const icons={tool:'wrench',reason:'brain',memory:'book',verification:'check',system:'clock'};const label={tool:'Tool call',reason:'Reasoning summary',memory:'Memory',verification:'Verification',system:'Event'}[e.kind]||'Event';const expandable=['tool','reason','memory'].includes(e.kind);
 if(expandable)return `<div class="event"><details><summary>${ico(icons[e.kind])}<span class="label">${label}: ${esc(e.label)}</span><time>${esc(e.time)}</time></summary><div class="event-desc">${esc(e.detail)}</div></details></div>`;
 return `<div class="event"><div class="event-head">${ico(icons[e.kind]||'clock')}<span class="label">${esc(e.label)}</span><time>${esc(e.time)}</time></div>${e.detail?`<div class="event-desc">${esc(e.detail)}</div>`:''}</div>`;
}
function toggleEvents(key){opened.has(key)?opened.delete(key):opened.add(key);showGoal(goalId);}
function demoHTML(g){let controls=[];
 if(g.id==='minecraft'&&g.status==='working'){if(g.stage===1)controls.push(['Simulate rule applied','applyMinecraft()']);if(g.stage===2)controls.push(['Simulate successful external join','completeGoal("minecraft")']);if(g.stage===3)controls.push(['Simulate no alternative found','noAlternative()']);}
 if(g.id==='backups'&&g.status==='working'){if(g.stage===1)controls.push(['Simulate backup configuration','configureBackup()']);if(g.stage===2)controls.push(['Simulate verified restoration','completeGoal("backups")']);}
 if(g.id==='nextcloud'&&g.status==='waiting')controls.push(['Simulate service recovery','recoverNextcloud()']);
 if(g.id==='nextcloud'&&g.status==='working')controls.push(['Simulate successful sync','completeGoal("nextcloud")']);
 if(g.id==='mph'&&g.status==='working')controls.push(['Simulate recommendation ready','completeGoal("mph")']);
 if(!controls.length)return '';
 return `<div class="demo"><div class="demo-title">Demo controls</div><div class="demo-actions">${controls.map(([label,fn])=>`<button onclick='${fn}'>${esc(label)}</button>`).join('')}</div><p class="note">These controls simulate work that would happen autonomously.</p></div>`;
}
function eventTo(child,kind,label,detail){child.events.push(ev(kind,label,detail));}
function completeGoal(id){const g=getGoal(id);if(!g||g.status!=='working')return;g.status='completed';g.stage=99;g.children.forEach(c=>{if(c.status!=='completed'){c.status='completed';eventTo(c,'verification','Outcome verified','Verified successfully (simulated).')}});const c=getChat(g.chat);c.history.push({kind:'assistant',text:g.finish||'Done. The goal was verified. (Simulated result.)'});c.unread=!(page==='chat'&&chatId===c.id);refresh();}
function answerApproval(ok){const g=getGoal('minecraft'),c=getChat('minecraft');if(g.status!=='blocked'||g.block!=='approval')return;
 g.status='working';g.block=null;
 if(ok){g.stage=1;g.children[2].status='working';eventTo(g.children[2],'system','Approval recorded','Explicit user authorization for inbound TCP 25565.');}
 else{g.stage=3;g.children[2].status='completed';eventTo(g.children[2],'system','Approval declined','The firewall configuration was not changed.');g.children.splice(3,0,{title:'Find a way to restore access without changing firewall rules',status:'working',events:[ev('reason','Reasoning summary','Investigate existing authorized tunnels or other approved paths.')]});c.history.push({kind:'assistant',text:'Understood. I won’t change the firewall. I’ll look for a permitted alternative.'});}
 }
function applyMinecraft(){const g=getGoal('minecraft');if(g.stage!==1)return;g.children[2].status='completed';eventTo(g.children[2],'tool','Apply approved inbound rule','Firewall rule applied (simulated).');g.children[g.children.length-1].status='working';g.stage=2;refresh();}
function noAlternative(){const g=getGoal('minecraft');if(g.stage!==3)return;const alt=g.children[3];alt.status='completed';eventTo(alt,'verification','No authorized alternative found','No available preapproved tunnel or alternative path found in this demo.');g.status='blocked';g.block='information';g.stage=4;const c=getChat(g.chat);c.history.push({kind:'assistant',text:'I couldn’t find an alternative that avoids opening an inbound port. Should I leave this goal on hold, or would you like to reconsider the firewall change?'});c.unread=!(page==='chat'&&chatId===c.id);refresh();}
function configureBackup(){const g=getGoal('backups');if(g.stage!==1)return;g.stage=2;g.children[2].status='completed';eventTo(g.children[2],'tool','Configure encrypted backups',`Destination: ${g.destination}; scheduled job configured (simulated).`);g.children[3].status='working';refresh();}
function recoverNextcloud(){const g=getGoal('nextcloud');if(g.status!=='waiting')return;g.status='working';g.block=null;g.children[1].status='completed';eventTo(g.children[1],'tool','CalDAV probe recovered','HTTP 200 (simulated).');g.children[2].status='working';refresh();}
function refresh(){if(page==='chat')showChat(chatId);else if(page==='goals')showGoals(filter);else showGoal(goalId);}
function goalMessageAction(g,c,clean){
 const lower=clean.toLowerCase();
 const stop=/^(pause|hold|stop)( this| the)?( goal| work)?[.! ]*$/i.test(clean.trim());
 const cancel=/^(cancel|abandon)( this| the)?( goal| work)?[.! ]*$/i.test(clean.trim());
 const resume=/^(resume|continue|restart)( this| the)?( goal| work)?[.! ]*$/i.test(clean.trim());
 // A direction change is different from an independent new request.
 const redirect=/^(wait|hold on|actually|instead|before you|don['’]t|do not)\b/i.test(clean);
 if(cancel){g.children.forEach(child=>{if(child.status==='working'||child.status==='blocked'||child.status==='paused')child.status='cancelled';});g.status='cancelled';g.block=null;c.history.push({kind:'assistant',text:'I’ve cancelled that goal. I won’t continue work on it.'});return true;}
 if(stop){g.children.forEach(child=>{if(child.status==='working')child.status='paused';});g.status='paused';g.block=null;c.history.push({kind:'assistant',text:'Paused. I’ll keep the goal and progress so we can resume later.'});return true;}
 if(resume && g.status==='paused'){
   g.status='working';g.block=null;
   const pausedChild=g.children.find(x=>x.status==='paused');if(pausedChild)pausedChild.status='working';
   c.history.push({kind:'assistant',text:'Resuming the existing goal.'});return true;
 }
 if(redirect && (g.status==='working'||g.status==='blocked')){
   // The original outcome is unchanged; the child-goal plan changes.
   const current=g.children.find(x=>x.status==='working'||x.status==='blocked');if(current){current.status='cancelled';eventTo(current,'system','Plan superseded',clean);}
   const title=/router/i.test(clean)?'Check router forwarding before any firewall changes':'Reevaluate the plan using your new instruction';
   g.children.splice(Math.max(0,g.children.length-1),0,{title,status:'working',events:[ev('system','User redirected execution',clean)]});
   g.status='working';g.block=null;g.stage=5;
   c.history.push({kind:'assistant',text:g.id==='minecraft'&&g.stage===5?'Understood. I’ll check the router first and won’t make additional firewall changes.':'Understood. I’ll incorporate that direction into the goal.'});return true;
 }
 return false;
}
function sendMessage(text){const c=getChat(chatId);if(!c)return;const clean=text.trim();if(!clean)return;c.history.push({kind:'user',text:clean});if(c.name==='New conversation')c.name=clean.slice(0,40);
 const current=goals.find(x=>x.chat===c.id && ['working','blocked','paused'].includes(x.status));
 if(current && goalMessageAction(current,c,clean)){refresh();return;}
 const g=goals.find(x=>x.chat===c.id && x.status==='blocked');
 if(g?.id==='backups' && g.block==='information'){
   g.destination=clean;g.block=null;g.status='working';g.stage=1;g.children[1].status='completed';eventTo(g.children[1],'system','User supplied destination',clean);g.children[2].status='working';c.history.push({kind:'assistant',text:`Got it. I’ll use ${clean} as the proposed backup destination and proceed with configuration. I’ll still request any necessary authorization before consequential operations.`});
 }else if(g?.id==='minecraft' && g.block==='approval'){
   const yes=/^(yes|yes,? go ahead|i approve|approve|authorized|you may|go ahead|please do|sure)[.! ]*(?:.*)?$/i.test(clean);
   const no=/^(no|decline|do not|don['’]t|not authorized|no thanks)[.! ]*(?:.*)?$/i.test(clean);
   if(yes){answerApproval(true);c.history.push({kind:'assistant',text:'Authorized. I’ll apply the rule, then test external connectivity.'});}
   else if(no){answerApproval(false);}
   else c.history.push({kind:'assistant',text:'Just to confirm: may I change the inbound TCP 25565 firewall rule? Please answer yes or no.'});
 }else if(g?.id==='minecraft' && g.stage===4){
   if(/reconsider|approve|firewall|try again/i.test(clean)){g.status='blocked';g.block='approval';g.stage=0;c.history.push({kind:'assistant',text:'Would you authorize the inbound TCP 25565 firewall change?'});}else{g.block='information';c.history.push({kind:'assistant',text:'I’ll leave the goal waiting for further direction.'});}
 }else{
   const id='new'+Date.now();goals.unshift({id,chat:c.id,title:clean,status:'working',stage:0,children:[{title:'Pursue the requested outcome',status:'working',events:[]}],finish:'Done. The requested goal was completed. (Simulated result.)'});
 }
 refresh();}
$('composer').addEventListener('submit',e=>{e.preventDefault();const val=$('composeinput').value;if(!val.trim())return;$('composeinput').value='';sendMessage(val)});
$('composeinput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('composer').requestSubmit();}});
function newChat(){const id='chat'+Date.now();chats.unshift({id,name:'New conversation',folder:'',unread:false,history:[]});showChat(id);$('composeinput').focus();}
function openSidebar(){$('sidebar').classList.add('open');$('scrim').classList.add('visible');document.body.classList.add('drawer-open');}
function closeSidebar(){$('sidebar').classList.remove('open');$('scrim').classList.remove('visible');document.body.classList.remove('drawer-open');}
function openSearch(){$('searchmodal').hidden=false;$('searchinput').value='';searchNow();$('searchinput').focus();closeSidebar();}
function closeSearch(){$('searchmodal').hidden=true;}
function searchNow(){const q=$('searchinput').value.toLowerCase();const matches=[...chats.filter(c=>c.name.toLowerCase().includes(q)||c.history.some(m=>m.text.toLowerCase().includes(q))).map(c=>({kind:'chat',id:c.id,name:c.name})),...goals.filter(g=>g.title.toLowerCase().includes(q)).map(g=>({kind:'goal',id:g.id,name:g.title}))].slice(0,15);$('searchresults').innerHTML=matches.map(m=>`<button class="searchresult" onclick="closeSearch();${m.kind==='chat'?'showChat':'showGoal'}('${m.id}')">${ico(m.kind==='chat'?'chat':'target')}<span>${esc(m.name)}</span><small>${m.kind==='chat'?'Conversation':'Goal'}</small></button>`).join('')||'<p class="empty">No matches.</p>';}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeSearch();closeSidebar()}if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch()}});
showChat('minecraft');
</script></body></html>
