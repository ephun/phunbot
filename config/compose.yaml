# Example only. Do not start without release authorization and populated runtime paths.
services:
  phunbot:
    image: node:22.19.0-bookworm-slim
    user: '${PHUNBOT_UID:-10000}:${PHUNBOT_GID:-10000}'
    command: [node, /app/server.mjs]
    working_dir: /app
    environment:
      PHUNBOT_ROOT: /data
      PI_CODING_AGENT_DIR: /data/config/pi/agent
      HOME: /data
      HOST: 0.0.0.0
      PORT: '8504'
    volumes:
      - '${PHUNBOT_RUNTIME_DIR:?set private runtime directory}:/data'
      - '${PHUNBOT_SOURCE_DIR:?set exact reviewed checkout src directory}:/app:ro'
    ports:
      - '${PHUNBOT_BIND_ADDRESS:-127.0.0.1}:${PHUNBOT_PORT:-8504}:8504'
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
